<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd84d">
<title>Official髭男dism ランダムガチャ</title>
<style>
*{box-sizing:border-box}
:root{
  --ink:#25313a;
  --navy:#263c4b;
  --navy2:#172934;
  --cream:#f5f1e8;
  --paper:#fbfaf6;
  --gold:#c9a95b;
  --sage:#91a59b;
  --rose:#b98d91;
  --line:rgba(38,60,75,.14);
}
html{background:var(--cream)}
body{
 margin:0;color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
 background:
 radial-gradient(circle at 12% 0%,rgba(201,169,91,.13) 0 90px,transparent 250px),
 radial-gradient(circle at 95% 20%,rgba(145,165,155,.14) 0 90px,transparent 260px),
 linear-gradient(145deg,#f7f4ed 0%,#f1f0eb 52%,#e9eeeb 100%);
 min-height:100vh;
}
body:before{
 content:"✦  ✧  ·  ✦  ✧  ·  ✦";
 position:fixed;inset:10px 0 auto;text-align:center;
 font-size:13px;letter-spacing:20px;color:#fff;opacity:.65;
 pointer-events:none;z-index:0;
}
.app{position:relative;z-index:1;max-width:680px;min-height:100vh;margin:auto;padding:30px 16px 42px;text-align:center}
.logo{
 display:inline-block;color:#edf0ed;background:var(--navy);
 border:1px solid rgba(255,255,255,.12);padding:8px 15px;border-radius:999px;
 font-size:9px;font-weight:900;letter-spacing:.24em;margin:2px 0 17px;
 box-shadow:0 8px 22px rgba(30,48,59,.13);
}
h1{font-size:clamp(29px,8vw,44px);line-height:1.12;margin:0 0 9px;font-weight:900;letter-spacing:-.035em;color:#263a47}
.sub{font-size:12px;font-weight:700;margin-bottom:20px;color:#718079;letter-spacing:.06em}

.home-card{
 background:rgba(255,255,255,.64);
 border:1px solid rgba(38,60,75,.12);
 border-radius:34px;padding:22px 14px 25px;
 box-shadow:0 20px 50px rgba(38,60,75,.10),inset 0 1px rgba(255,255,255,.9);
 backdrop-filter:blur(14px);
}

/* ガチャ本体：動きは既存のまま、色・造形だけ落ち着いたトーンへ */
.machine{
 width:280px;height:360px;margin:2px auto 14px;position:relative;
 filter:drop-shadow(0 14px 18px rgba(31,45,52,.16));
}
.top{
 position:absolute;left:28px;top:0;width:224px;height:82px;
 background:linear-gradient(145deg,#d9c58f,#b99d60);
 border:3px solid #344550;border-radius:50% 50% 18px 18px;z-index:2;
 box-shadow:inset 0 3px 0 rgba(255,255,255,.4);
}
.top:after{
 content:"✦";position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%);font-size:28px;color:#f8f4e9;
}
.glass{
 position:absolute;left:42px;top:38px;width:196px;height:190px;
 background:linear-gradient(145deg,rgba(190,208,199,.94),rgba(153,181,190,.94));
 border:3px solid #344550;border-radius:50% 50% 24px 24px;overflow:hidden;z-index:1;
 box-shadow:inset 0 4px 16px rgba(255,255,255,.28);
}
.glass:before{
 content:"";position:absolute;inset:12px;border:2px dashed rgba(247,244,233,.62);
 border-radius:50%;animation:orbit 1.8s linear infinite;
}
.globe{
 position:absolute;width:110px;height:110px;left:38px;top:25px;border-radius:50%;
 background:radial-gradient(circle at 32% 27%,#f6eed2 0 10%,transparent 11%),
 linear-gradient(135deg,#d8c58d,#b99d60);
 border:3px solid #344550;
 box-shadow:inset -14px -14px 0 #a58b54;
 animation:glow 1.1s ease-in-out infinite alternate;
}
.capsule{
 position:absolute;width:38px;height:38px;left:78px;top:106px;border-radius:50%;
 background:linear-gradient(135deg,#c59ca0 50%,#879ba5 50%);
 border:2px solid #344550;transform:rotate(15deg);z-index:3;
 box-shadow:0 4px 9px rgba(30,45,54,.18);
}
.body{
 position:absolute;left:28px;top:190px;width:224px;height:130px;
 background:linear-gradient(145deg,#4b6370,#344b58 58%,#536b70);
 border:3px solid #344550;border-radius:8px 8px 28px 28px;z-index:3;
 box-shadow:inset 0 2px rgba(255,255,255,.16);
}
.slot{position:absolute;left:65px;top:23px;width:94px;height:12px;background:#182a34;border-radius:20px}
.slot:after{content:"";position:absolute;left:13px;top:3px;width:68px;height:5px;background:#e7e1d2;border-radius:10px;opacity:.42}
.knob{
 position:absolute;right:29px;top:48px;width:42px;height:42px;border-radius:50%;
 background:#cdb16c;border:3px solid #263943;box-shadow:0 5px 0 #253741;
}
.handle{
 position:absolute;right:0;top:72px;width:48px;height:10px;background:#eee9dc;
 border:3px solid #344550;border-radius:10px;transform:rotate(70deg);transform-origin:left center;
}
.tray{
 position:absolute;left:68px;bottom:3px;width:144px;height:41px;
 background:#c8ae70;border:3px solid #344550;border-radius:0 0 20px 20px;z-index:4;
}
.tray:after{content:"✦  ·  ✦  ·  ✦";font-size:10px;letter-spacing:4px;color:#f7f1df}

.spin .knob{animation:knobTurn .32s linear 8}
.spin .handle{animation:handleMove .64s ease-in-out 4}
.spin .globe{animation:globeFlash .28s linear 9}
.spin .capsule{animation:capsuleBounce .42s ease-in-out 6}
.spin .glass:before{animation:orbit .55s linear 11}
@keyframes knobTurn{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes handleMove{0%,100%{transform:rotate(70deg)}45%{transform:rotate(105deg)}60%{transform:rotate(70deg)}}
@keyframes globeFlash{0%,100%{filter:brightness(1)}50%{filter:brightness(1.55)}}
@keyframes capsuleBounce{0%,100%{transform:translateY(0) rotate(15deg)}50%{transform:translateY(-24px) rotate(195deg)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes glow{to{box-shadow:inset -14px -14px 0 #a58b54,0 0 18px rgba(255,247,219,.8)}}

.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
button{
 border:1px solid rgba(38,60,75,.18);border-radius:999px;padding:14px 20px;
 font-weight:850;font-size:15px;cursor:pointer;
 box-shadow:0 8px 20px rgba(38,60,75,.12);
 transition:transform .15s ease,box-shadow .15s ease;
}
.main{background:#d2b66f;color:#263943}
.five{background:#9eafa7;color:#263943}
.main:active,.five:active,.again:active{transform:translateY(2px);box-shadow:0 4px 10px rgba(38,60,75,.10)}

.hidden{display:none!important}
.result-title{font-size:29px;font-weight:900;margin:0 0 13px;color:#263a47}
.result-list{display:grid;gap:12px}
.result{
 background:rgba(251,250,246,.88);color:#263943;border:1px solid var(--line);
 border-radius:23px;padding:18px 15px;text-align:center;
 box-shadow:0 12px 30px rgba(38,60,75,.09);backdrop-filter:blur(8px);
}
.rank{font-weight:900;font-size:16px;margin-bottom:9px;letter-spacing:.08em}
.title{font-weight:900;font-size:clamp(22px,6vw,32px);line-height:1.25;color:#263943}
.quote{color:#66736f;line-height:1.65;margin:10px 0;font-weight:650}
.prob{display:inline-block;background:#344b58;color:#f7f3e8;border-radius:999px;padding:7px 12px;font-weight:850;font-size:12px;margin-top:8px}
.desc{color:#77827f;font-size:12px;line-height:1.6;margin-top:10px}
.bonus-detail{font-size:.78em;font-weight:750;letter-spacing:0;color:#5d6b68}
.result .quote{overflow-wrap:anywhere}
@media(max-width:600px){
 .result-list{gap:7px}
 .result{border-radius:16px;padding:9px 10px}
 .rank{font-size:12px;margin-bottom:3px;letter-spacing:.04em}
 .title{font-size:18px;line-height:1.18}
 .quote{font-size:11px;line-height:1.38;margin:4px 0 2px}
 .prob{font-size:9px;padding:4px 8px;margin-top:3px}
 #resultScreen .again{margin-top:10px;padding:10px 16px;font-size:13px}
}
.again{background:#d2b66f;margin-top:20px;color:#263943}
.note,.footer{font-size:10px;line-height:1.7;margin-top:18px;font-weight:650;color:#78837f}
.footer{margin-top:25px}

.overlay{
 position:fixed;inset:0;
 background:rgba(24,38,46,.96);
 z-index:20;display:flex;align-items:center;justify-content:center;
 flex-direction:column;padding:22px;text-align:center;
}
.overlay .machine{margin:0 auto 4px;transform:scale(.88);flex:none}
.loading-wrap{width:min(92vw,440px);margin-top:-10px}
.loading{color:#f3efe4;font-weight:900;font-size:21px;line-height:1.3}
.loading-sub{color:#d2b66f;font-weight:800;font-size:12px;margin-top:8px}
.dots{display:inline-block;min-width:24px;text-align:left}
.dots:after{content:"";animation:dots 1s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""}}

@media(max-width:380px){
 .machine{transform:scale(.9);transform-origin:top center;margin-bottom:-22px}
 .overlay .machine{transform:scale(.76);margin-bottom:-70px}
}
</style>
</head>
<body>
<div class="app">
<section id="home">
<div class="logo">OFFICIAL HIGE DANDISM</div>
<h1>🎰 Official髭男dism<br>ランダムガチャ</h1>
<div class="sub">あなたを待っているのは、どんな結果？</div>
<div class="home-card">
<div class="machine" id="machine"><div class="top"></div><div class="glass"><div class="globe"></div><div class="capsule"></div></div><div class="body"><div class="slot"></div><div class="knob"></div><div class="handle"></div></div><div class="tray"></div></div>
<div class="buttons"><button class="main" onclick="start(1)">🎰 ガチャを1回まわす</button><button class="five" onclick="start(5)">🎰 ガチャを5回まわす</button></div>
<div class="note">※ファンメイドの非公式コンテンツです</div>
</div>
</section>
<section id="resultScreen" class="hidden">
<div class="logo">YOUR RESULT</div><h2 class="result-title">🎉 ガチャ結果！</h2><div id="result" class="result-list"></div>
<button class="again" onclick="again()">🎰 もう一回まわす</button>
</section>
<div class="footer">Official髭男dism公式とは関係ありません。<br>個人制作のファンメイドコンテンツです。</div>
</div>
<div id="overlay" class="overlay hidden"><div class="machine" id="mini"><div class="top"></div><div class="glass"><div class="globe"></div><div class="capsule"></div></div><div class="body"><div class="slot"></div><div class="knob"></div><div class="handle"></div></div><div class="tray"></div></div><div class="loading-wrap"><div class="loading">ガチャを回しています<span class="dots"></span></div><div class="loading-sub">レバーを回して、結果を抽選中… ✦</div></div></div>
<script>
const data=[
["N","ふつう",60,["コラボキンキンダンブラー|世間を賑わせたタンブラー。受注生産になったから手に入りやすくなった！","デジタルボーナス(藤原聡が歌う姿)|…またかっ！","デジタルボーナス(小笹大輔がギターを掲げる姿)|…またかっ！","デジタルボーナス(楢ちゃんが俯きながらギターを演奏する姿)|…またかっ！","デジタルボーナス(ちゃんまつの後ろ姿)|…またかっ！","デジタルボーナス(集合ver)|…またかっ！","メモリアルチケット|ふつうに嬉しい！","銀テ1本|1本でも取れて嬉しい。大事に持ち帰ろう！","次回ライブの座席運UP券|次は1列でも前になりますように！","デジタルボーナス（藤原聡の後ろ姿）|…またかっ！","デジタルボーナス（藤原聡のにっこりオフショット）|…またかっ！","デジタルボーナス(4人の後ろ姿)|…またかっ！","デジタルボーナス(ドラムを叩くちゃんまつ)|…またかっ！","デジタルボーナス(サックスを吹く楢﨑誠)|…またかっ！","デジタルボーナス(ピアノを弾く藤原聡)|…またかっ！","デジタルボーナス(前に手を伸ばす藤原聡)|…またかっ！"]],
["R","ちょっといい",26,["銀テ5本|フォローワーさんにあげる心の余裕ができるね！","次回ツアーのチケット|お席用意してくれてありがとう！","好きな曲が次回ツアーのセトリ入り|場合によっては、大号泣","好きな曲がライブの1曲目|やばすぎる。","アリーナ席確定チケット|どこの席でも楽しいけど、アリーナはテンションあがっちゃう！","次のライブで絶対に良席になる権利|1番嬉しいかも！","自分の好きな曲がライブで特別アレンジされる|五感に焼き付けましょう","自分の誕生日に髭男のライブが開催される|一生忘れられないお誕生日プレゼント"]],
["SR","レア",9,["さとっちゃんの投げたタオル|…どうする？さすがに、匂い嗅ぐ...？","ちゃんまつのドラムスティック|ちゃんまつがにこにこしながら近づいてきてアイコンタクトの後、見事にキャッチ！","大ちゃんのピック|ピックを受け取ったあと、大ちゃんからのキラースマイルもプレゼント！","サイン入りタオル|洗えない、絶対","銀テ10本|もはや、周りの人の奪ったレベル","にこにこの楢ちゃんと目が合う|こっちは倍にこにこしちゃうね","さとっちゃんと目が合う|真っ直ぐな目で見られたら時が止まっちゃうよ","大ちゃんと目が合う|恋に落ちちゃうね","ちゃんまつと目が合う|結構ステージから距離あるのに目が合うなんて奇跡だね！","ならちゃんがこっちを見て笑う|つられてこちらも笑顔になっちゃうね"]],
["SSR","激レア",4,["次回ツアーの最前席チケット|みんなが妄想する景色！","さとっちゃんの作曲ルームご招待券|制作秘話に加え、生歌も聞けちゃったりして！","大ちゃんの機材ルームご招待券|めっちゃ予習してこ！","リハーサル見学券|特等席でリラックスしたメンバーを観察！","4人と30分お話しできる権利|...何話そう？","未公開音源を1曲だけ聴ける|考えるだけでドキドキ！","メンバー4人と記念撮影|何のポーズするか迷っちゃう！"]],
["UR","超激レア",0.9,["自分の名前入りサイン|下の名前？フルネーム？ニックネーム？迷うよ〜！！！！","メンバーと1対1でお話しできる|語彙力が試されるとき...！しっかり愛を伝えられるかな？","好きな曲をメンバーが目の前で演奏してくれる|何の曲選べばいいのー！！！","4人から自分だけにメッセージ|いつも頑張っているあなたに向けた特別なメッセージ！","メンバーの私物|誰の何かは想像にお任せします！","ライブ終演後にメンバーと乾杯|何の話しよう？"]],
["LEGEND","神",0.1,["藤原聡|今日はあなたのために歌います","小笹大輔|今日はあなたのために弾きます","楢﨑誠|今日はあなたのために弾きます","松浦匡希|今日はあなたのために叩きます"]]
];
const stars={N:"🌟",R:"🌟🌟",SR:"🌟🌟🌟",SSR:"🌟🌟🌟🌟",UR:"🌟🌟🌟🌟🌟",LEGEND:"🌟🌟🌟🌟🌟🌟"};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function parseItem(s){const i=s.indexOf('|');return i<0?{title:s,comment:""}:{title:s.slice(0,i),comment:s.slice(i+1)}}
function pick(){let n=Math.random()*100;for(const d of data){if(n<d[2])return d;n-=d[2]}return data[0]}
function oneResult(){const d=pick(),item=parseItem(d[3][Math.floor(Math.random()*d[3].length)]),prob=d[2]/d[3].length;return {d,item,prob}}
function start(count){
 const overlay=document.getElementById("overlay"),mini=document.getElementById("mini");
 overlay.classList.remove("hidden");mini.classList.remove("spin");void mini.offsetWidth;mini.classList.add("spin");
 setTimeout(()=>{const results=Array.from({length:count},oneResult);show(results)},2500)
}
function show(results){
 document.getElementById("overlay").classList.add("hidden");document.getElementById("home").classList.add("hidden");document.getElementById("resultScreen").classList.remove("hidden");
 document.getElementById("result").innerHTML=results.map((r,i)=>{
   const d=r.d,it=r.item,showProb=["SR","SSR","UR","LEGEND"].includes(d[0]);
   const title=esc(it.title).replace(/^デジタルボーナス([（(].*?[）)])$/, 'デジタルボーナス<br><span class="bonus-detail">$1</span>');
   return `<div class="result"><div class="rank">${stars[d[0]]}：${esc(d[1])}</div><div class="title">${title}</div>${it.comment?`<div class="quote">${esc(it.comment)}</div>`:""}${showProb?`<div class="prob">出現確率：約${r.prob.toFixed(2)}%</div>`:""}</div>`
 }).join("");
}
function again(){location.reload()}
</script>
</body>
</html>
