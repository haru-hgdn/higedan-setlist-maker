<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Official髭男dism ランダムガチャ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fffdf7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.app{max-width:620px;min-height:100vh;margin:auto;padding:28px 18px 36px;text-align:center}
.logo{color:#9de8d2;font-size:12px;font-weight:800;letter-spacing:.15em;margin:8px 0 18px}
h1{font-size:clamp(30px,8vw,45px);line-height:1.15;margin:0 0 12px}.sub{color:#aeb7c6;font-size:13px;margin-bottom:30px}
.machine{width:280px;height:360px;margin:0 auto 28px;position:relative}
.top{position:absolute;left:28px;top:0;width:224px;height:82px;background:#29364e;border:4px solid #52627e;border-radius:50% 50% 18px 18px}
.glass{position:absolute;left:42px;top:38px;width:196px;height:190px;background:#1b263b;border:5px solid #52627e;border-radius:50% 50% 24px 24px;overflow:hidden}
.globe{position:absolute;width:110px;height:110px;left:38px;top:25px;border-radius:50%;background:#ffd34e;border:5px solid #ffe789;box-shadow:inset -15px -15px #dba82c55}
.capsule{position:absolute;width:38px;height:38px;left:78px;top:106px;border-radius:50%;background:#ff9eb5;border:3px solid #fff8;transform:rotate(15deg)}
.body{position:absolute;left:28px;top:190px;width:224px;height:130px;background:#223048;border:4px solid #52627e;border-radius:8px 8px 28px 28px}
.slot{position:absolute;left:70px;top:25px;width:84px;height:10px;background:#080d15;border-radius:20px}
.knob{position:absolute;right:32px;top:48px;width:40px;height:40px;border-radius:50%;background:#ffd84d;box-shadow:0 5px #b08d1d}
.handle{position:absolute;right:0;top:74px;width:45px;height:8px;background:#7988a0;border-radius:10px;transform:rotate(70deg);transform-origin:left}
.tray{position:absolute;left:70px;bottom:4px;width:140px;height:40px;background:#0b111d;border:4px solid #52627e;border-radius:0 0 18px 18px}
.spin .knob{animation:turn .7s ease-in-out 3}@keyframes turn{50%{transform:rotate(80deg)}}
button{border:0;border-radius:999px;padding:15px 25px;font-weight:900;font-size:16px;cursor:pointer}
.main{background:#ffd84d;color:#101827;box-shadow:0 6px #b08d1d}.main:active{transform:translateY(3px)}
.hidden{display:none!important}
.result{background:#fffdf7;color:#101827;border-radius:28px;padding:28px 20px;border:4px solid #29364e}
.rank{font-weight:900;font-size:16px;margin-bottom:16px}.title{font-weight:900;font-size:clamp(25px,7vw,40px);line-height:1.25}.quote{color:#566070;line-height:1.7;margin:16px 0}
.prob{display:inline-block;background:#edf1f5;border-radius:999px;padding:9px 15px;font-weight:900;font-size:13px}.desc{color:#697386;font-size:12px;margin-top:10px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}.save{background:#101827;color:white}.again{background:#ffd84d;color:#101827}
.note,.footer{color:#788397;font-size:10px;line-height:1.7;margin-top:18px}
.overlay{position:fixed;inset:0;background:#080d16f5;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column}.overlay .machine{transform:scale(.8);margin:-30px 0}.loading{font-weight:900;font-size:19px}
</style>
</head>
<body>
<div class="app">
<section id="home">
<div class="logo">OFFICIAL HIGE DANDISM</div>
<h1>🎰 Official髭男dism<br>ランダムガチャ</h1>
<div class="sub">あなたを待っているのは、どんな結果？</div>
<div class="machine" id="machine"><div class="top"></div><div class="glass"><div class="globe"></div><div class="capsule"></div></div><div class="body"><div class="slot"></div><div class="knob"></div><div class="handle"></div></div><div class="tray"></div></div>
<button class="main" onclick="start()">🎰 ガチャを回す</button>
<div class="note">※ファンメイドの非公式コンテンツです</div>
</section>
<section id="resultScreen" class="hidden">
<div class="logo">YOUR RESULT</div><h1 style="font-size:30px">🎉 ガチャ結果！</h1><div id="result"></div>
</section>
<div class="footer">Official髭男dism公式とは関係ありません。<br>個人制作のファンメイドコンテンツです。</div>
</div>
<div id="overlay" class="overlay hidden"><div class="machine" id="mini"><div class="top"></div><div class="glass"><div class="globe"></div><div class="capsule"></div></div><div class="body"><div class="slot"></div><div class="knob"></div><div class="handle"></div></div><div class="tray"></div></div><div class="loading">ガチャを回しています…</div></div>
<script>
const data=[
["N","ふつう",50,"🩶","よく出る。だけど、出たらちゃんと嬉しい。",["コラボキンキンダンブラー","ベースボールシャツ","デジタルボーナス","メモリアルチケット","銀テ1本","ライブフォト","オリジナルステッカー","次回ライブの座席運UP券"]],
["R","ちょっといい",30,"💛","ちょっとレア。ライブ前ならかなり嬉しい。",["銀テ5本","サイン入りタオル","次回ツアーのチケット","好きな曲が次回ツアーのセトリ入り","好きな曲がライブの1曲目","アリーナ席確定チケット","次のライブで絶対に良席になる権利","自分の好きな曲がライブで特別アレンジされる","自分の誕生日に髭男のライブが開催される","銀テ10本"]],
["SR","レア",12,"💙","レア！ オタクの心がざわつく結果。",["さとっちゃんの投げたタオル","ちゃんまつのドラムスティック","大ちゃんのピック","にこにこの楢ちゃんと目が合う","さとっちゃんと目が合う","大ちゃんと目が合う","ちゃんまつと目が合う","ならちゃんがこっちを見て笑う"]],
["SSR","激レア",6,"💜","激レア！ 一生語れる思い出になるかも。",["次回ツアーの最前席チケット","さとっちゃんの作曲ルームご招待券","大ちゃんの機材ルームご招待券","リハーサル見学券","4人と30分お話しできる権利","未公開音源を1曲だけ聴ける","メンバー4人と記念撮影"]],
["UR","超激レア",1.8,"💎","超激レア！！ 夢みたいな結果。",["自分の名前入りサイン","メンバーと1対1でお話しできる","好きな曲をメンバーが目の前で演奏してくれる","4人から自分だけにメッセージ","メンバーの私物","ライブ終演後にメンバーと乾杯"]],
["LEGEND","神",0.2,"👼🏻","神。引いたあなたは今日の主役。",["藤原聡","小笹大輔","楢﨑誠","松浦匡希"]]
];
const quotes={"藤原聡":"今日はあなたのために歌います","小笹大輔":"今日はあなたのために弾きます","楢﨑誠":"今日はあなたのために弾きます","松浦匡希":"今日はあなたのために叩きます"};
const esc=s=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function pick(){let n=Math.random()*100;for(const d of data){if(n<d[2])return d;n-=d[2]}return data[0]}
function start(){
 document.getElementById("overlay").classList.remove("hidden");document.getElementById("mini").classList.add("spin");
 setTimeout(()=>{let d=pick(),item=d[5][Math.floor(Math.random()*d[5].length)],p=(d[2]/d[5].length).toFixed(2);show(d,item,p)},2300)
}
function show(d,item,p){
 document.getElementById("overlay").classList.add("hidden");document.getElementById("home").classList.add("hidden");document.getElementById("resultScreen").classList.remove("hidden");
 let q=d[0]=="LEGEND"?quotes[item]:"";
 document.getElementById("result").innerHTML='<div class="result"><div class="rank" style="color:'+d[3]+'">'+d[3]+' '+d[0]+'（'+d[1]+'）</div><div class="title">'+esc(item)+'</div>'+(q?'<div class="quote">「'+esc(q)+'」</div>':'')+'<div class="prob">出現確率：'+p+'%</div><div class="desc">'+d[4]+'</div><div class="actions"><button class="save" onclick="save()">🖼️ 結果を保存する</button><button class="again" onclick="again()">🎰 もう一回まわす</button></div></div>';
 window._result={rank:d[0],label:d[1],icon:d[3],item,prob:p,quote:q}
}
function again(){location.reload()}
function save(){
 const r=window._result,c=document.createElement("canvas"),x=c.getContext("2d");c.width=1080;c.height=1350;
 x.fillStyle="#101827";x.fillRect(0,0,c.width,c.height);x.fillStyle="#fffdf7";x.fillRect(55,55,970,1240);x.textAlign="center";x.fillStyle="#101827";
 x.font="900 38px sans-serif";x.fillText("🎰 Official髭男dism ランダムガチャ",540,145);
 x.font="900 42px sans-serif";x.fillText(r.icon+" "+r.rank+"（"+r.label+"）",540,255);
 x.font="900 62px sans-serif";let lines=[],cur="";for(const ch of r.item){if(x.measureText(cur+ch).width>900){lines.push(cur);cur=ch}else cur+=ch}if(cur)lines.push(cur);let y=430;lines.forEach(t=>{x.fillText(t,540,y);y+=80});
 if(r.quote){x.font="500 30px sans-serif";x.fillStyle="#566070";x.fillText("「"+r.quote+"」",540,y+30)}
 x.fillStyle="#101827";x.font="900 32px sans-serif";x.fillText("出現確率："+r.prob+"%",540,1040);
 x.font="500 22px sans-serif";x.fillStyle="#697386";x.fillText("ファンメイド・非公式",540,1170);
 const img=c.toDataURL("image/png"),w=window.open();if(w){w.document.write('<body style="margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh"><img src="'+img+'" style="max-width:100%"></body>');w.document.close()}else document.body.innerHTML='<div style="background:#111;min-height:100vh;display:flex;align-items:center;justify-content:center"><img src="'+img+'" style="max-width:100%"></div>'
}
</script>
</body>
</html>
