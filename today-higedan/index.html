<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の髭男ランダムガチャ｜Official髭男dism</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101722;color:#f8f4e8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{max-width:680px;margin:auto;padding:24px 16px 50px}
h1{font-size:30px;line-height:1.2;margin:12px 0 8px;text-align:center}
.sub{text-align:center;color:#cbd2d9;font-size:13px;margin-bottom:28px}
.card{background:#1b2531;border:1px solid #35414f;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 22px rgba(0,0,0,.2)}
.q{font-weight:800;font-size:18px;margin-bottom:12px}
.options{display:grid;gap:9px}
label{display:block}
input{display:none}
.opt{display:block;padding:14px 15px;border-radius:14px;background:#263342;border:1px solid #405064;cursor:pointer;font-weight:700}
input:checked+.opt{background:#d9d36a;color:#111820;border-color:#f0e96e}
button{width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:900;cursor:pointer}
.gachaBtn{background:#d9d36a;color:#111820;margin-top:10px}
.result{display:none;margin-top:22px}
.result h2{font-size:24px;margin:0 0 8px}
.theme{background:#263342;border-radius:15px;padding:14px;margin:12px 0 16px}
.song{padding:12px 0;border-bottom:1px solid #3a4653;font-size:17px;font-weight:800}
.song:last-child{border-bottom:0}
.first{font-size:19px;font-weight:900;background:#d9d36a;color:#111820;padding:14px;border-radius:15px;margin-top:16px}
.saveBtn{background:#eef0e8;color:#111820;margin-top:14px}
.note{font-size:12px;color:#aeb8c2;text-align:center;margin-top:10px;line-height:1.6}
.overlay{position:fixed;inset:0;background:rgba(7,11,17,.96);display:none;align-items:center;justify-content:center;z-index:20}
.machine{text-align:center}
.machineBody{width:250px;height:270px;border-radius:35px;background:#273442;border:3px solid #d9d36a;position:relative;margin:auto;box-shadow:0 0 35px rgba(217,211,106,.18)}
.globe{position:absolute;width:150px;height:150px;border-radius:50%;background:#e9e6d7;color:#18202a;left:47px;top:25px;display:flex;align-items:center;justify-content:center;font-size:62px;box-shadow:inset 0 0 0 8px #b8b7ad;animation:spin 1.1s linear infinite}
.slot{position:absolute;bottom:34px;left:77px;width:96px;height:42px;border-radius:12px;background:#101722;border:2px solid #66717d}
.handle{position:absolute;right:-43px;top:105px;width:45px;height:15px;background:#d9d36a;border-radius:10px;transform-origin:left center;animation:pull 1.5s ease-in-out infinite}
.handle:after{content:"";position:absolute;right:-8px;top:-7px;width:28px;height:28px;border-radius:50%;background:#d9d36a}
.capsule{font-size:48px;margin-top:-35px;opacity:0;animation:pop 1.6s 1.1s ease-out forwards}
.status{font-weight:800;margin-top:18px;color:#f4efcf}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pull{0%,60%,100%{transform:rotate(0)}70%,82%{transform:rotate(22deg)}}
@keyframes pop{0%{transform:translateY(0) scale(.3);opacity:0}55%{opacity:1}100%{transform:translateY(55px) scale(1);opacity:1}}
.shake{animation:shake .22s linear 6}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>

const moodMap={
empty:["🎧","何も考えず、音に身をゆだねる日。"],
up:["🔥","今日は思いっきりテンションを上げる日！"],
heal:["🪴","ちょっとひと息。ヒゲダンで心をゆるめる日。"],
energy:["💪🏻","もうひと踏ん張り。背中を押してもらう日！"]
};

function selected(name){
const x=document.querySelector('input[name="'+name+'"]:checked');
return x?x.value:null;
}

function scoreSong(s,q1,q2,q3){
let score=Math.random()*3;
if(q2===s.era)score+=6;
if(q3&&s.scene.includes(q3))score+=4;
if(q1==="up"&&s.mood.includes("🔥"))score+=4;
if(q1==="energy"&&s.mood.includes("💪"))score+=4;
if(q1==="heal"&&(s.mood.includes("🥹")||s.mood.includes("💭")))score+=4;
if(q1==="empty"&&(s.mood.includes("💭")||s.mood.includes("🥹")))score+=4;
return score;
}

function makeResult(){
const q1=selected("q1"),q2=selected("q2"),q3=selected("q3");
if(!q1||!q2||!q3){alert("3問すべて選んでね☺️");return false;}
const ranked=songs.map(s=>({...s,score:scoreSong(s,q1,q2,q3)})).sort((a,b)=>b.score-a.score);
const picked=ranked.slice(0,5);
document.getElementById("theme").textContent=moodMap[q1][0]+" "+moodMap[q1][1];
document.getElementById("songs").innerHTML=picked.map((s,i)=>`<div class="song">${i+1}. ${s.name}</div>`).join("");
document.getElementById("first").textContent="🎧 今日の1曲目： "+picked[0].name;
document.getElementById("result").style.display="block";
window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
return true;
}

function playGacha(){
if(!selected("q1")||!selected("q2")||!selected("q3")){alert("3問すべて選んでね☺️");return;}
const overlay=document.getElementById("overlay"),machine=document.getElementById("machine"),status=document.getElementById("status");
overlay.style.display="flex";machine.classList.remove("shake");void machine.offsetWidth;machine.classList.add("shake");
status.textContent="運命の5曲を抽選中…";
setTimeout(()=>status.textContent="どの曲が出るかな…🎵",850);
setTimeout(()=>{overlay.style.display="none";makeResult();},2250);
}

function savePNG(){
const result=document.getElementById("result");
if(result.style.display==="none")return;

const canvas=document.createElement("canvas"),scale=2,w=900,h=1150;
canvas.width=w*scale;canvas.height=h*scale;
const c=canvas.getContext("2d");c.scale(scale,scale);
c.fillStyle="#101722";c.fillRect(0,0,w,h);
c.fillStyle="#f8f4e8";c.textAlign="center";
c.font="900 44px -apple-system,BlinkMacSystemFont,sans-serif";
c.fillText("🎧 今日の髭男ランダムガチャ",w/2,85);
c.fillStyle="#263342";c.beginPath();c.roundRect(55,130,w-110,880,28);c.fill();
c.fillStyle="#f8f4e8";c.font="900 34px -apple-system,BlinkMacSystemFont,sans-serif";
c.fillText("今日のあなたの5曲",w/2,200);
c.font="700 24px -apple-system,BlinkMacSystemFont,sans-serif";
c.fillText(document.getElementById("theme").textContent,w/2,250);
c.textAlign="left";c.font="800 30px -apple-system,BlinkMacSystemFont,sans-serif";
document.querySelectorAll("#songs .song").forEach((el,i)=>c.fillText(el.textContent,105,335+i*82));
c.fillStyle="#d9d36a";c.beginPath();c.roundRect(90,765,w-180,125,22);c.fill();
c.fillStyle="#111820";c.textAlign="center";c.font="900 29px -apple-system,BlinkMacSystemFont,sans-serif";
c.fillText(document.getElementById("first").textContent,w/2,840);
c.fillStyle="#aeb8c2";c.font="500 18px -apple-system,BlinkMacSystemFont,sans-serif";
c.fillText("Official髭男dism ファンメイド",w/2,965);

const data=canvas.toDataURL("image/png");
const win=window.open();
if(win){
win.document.write('<title>今日の髭男ランダムガチャ</title><body style="margin:0;background:#101722;display:flex;justify-content:center;align-items:flex-start;"><img src="'+data+'" style="max-width:100%;height:auto;"></body>');
win.document.close();
}else{
document.body.innerHTML='<div style="margin:0;background:#101722;min-height:100vh;text-align:center;padding:12px"><p style="color:#f8f4e8">画像を長押しして保存してね📱</p><img src="'+data+'" style="max-width:100%;height:auto"></div>';
}
}
